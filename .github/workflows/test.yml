name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test — verify all modules import
        run: |
          python -c "
          from core.agent import FinanceAgent
          from models.schemas import AgentState, BudgetCritique, SuggestedRatios
          from tools.registry import TOOL_REGISTRY, TOOL_SCHEMAS
          from tools.tracing import get_langfuse_client, TraceContext, scrub_content
          from memory.manager import MemoryManager
          print(f'{len(TOOL_REGISTRY)} tools loaded, all imports OK')
          "

      - name: Run unit tests
        run: python test.py
